<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>FilesXray</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6eb; --text:#1d2330; --muted:#6b7280;
          --accent:#2563eb; --bar:#93b4f5; --empty:#fff4e5; --emptyText:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 24px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  input[type=text] { flex:1; min-width:320px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:14px; }
  button { padding:8px 12px; border:1px solid var(--line); background:#fff; border-radius:6px; cursor:pointer; font-size:13px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:hover { filter:brightness(0.95); }
  button.danger { background:#fff; color:#b91c1c; border-color:#f3c2c2; }
  button.danger:hover { background:#fdecec; }
  button:disabled { opacity:.5; cursor:default; }
  .link.danger { color:#b91c1c; }
  .link.danger:hover { color:#7f1d1d; text-decoration:underline; }
  .notice { padding:10px 14px; border-radius:6px; margin:0 0 12px; font-size:14px; }
  .notice.ok { background:#e8f7ee; color:#166534; border:1px solid #bfe5cc; }
  .notice.err { background:#fdecec; color:#991b1b; border:1px solid #f3c2c2; }
  main { padding:18px 24px; max-width:1200px; }
  .crumbs { font-size:14px; margin-bottom:10px; }
  .crumbs a { color:var(--accent); cursor:pointer; text-decoration:none; }
  .summary { display:flex; gap:24px; margin:8px 0 14px; font-size:14px; color:var(--muted); flex-wrap:wrap; align-items:center; }
  .summary b { color:var(--text); }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; font-size:14px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; }
  th { background:#fafbfc; font-weight:600; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  td.num { text-align:right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  tr.folder td.name { cursor:pointer; color:var(--accent); font-weight:500; }
  tr.folder:hover { background:#f1f5ff; }
  tr.empty { background:var(--empty); }
  .tag { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; font-weight:600; }
  .tag.empty { background:#fde3c0; color:var(--emptyText); }
  .tag.denied { background:#fde2e2; color:#b91c1c; }
  .tag.yes { background:#e0ecff; color:#1e40af; }
  .tag.no { background:#eef0f3; color:var(--muted); }
  .bar { height:8px; background:#eef0f3; border-radius:4px; min-width:120px; }
  .bar > div { height:8px; background:var(--bar); border-radius:4px; }
  .muted { color:var(--muted); font-size:12px; }
  h2 { font-size:15px; margin:24px 0 8px; }
  .link { color:var(--muted); cursor:pointer; font-size:12px; }
  .link:hover { color:var(--accent); }
  #status { color:var(--muted); font-size:14px; padding:20px 0; }
  .error { color:#b91c1c; }
</style>
</head>
<body>
<header>
  <h1>🩻 FilesXray</h1>
  <input type="text" id="pathInput" placeholder="z. B. C:\Users\Name\Documents">
  <button class="primary" onclick="go(document.getElementById('pathInput').value)">Anzeigen</button>
  <button onclick="refresh()" title="Größen neu berechnen (nach Änderungen an Dateien)">↻ Neu scannen</button>
</header>
<main>
  <div class="crumbs" id="crumbs"></div>
  <div class="summary" id="summary"></div>
  <div id="notice"></div>
  <div id="status">Lade …</div>
  <div id="content"></div>
</main>

<script>
const DEFAULT_PATH = __DEFAULT_PATH__;
let current = null;
let onlyEmpty = false;

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gb = b => (b / 1024**3).toFixed(2).replace('.', ',') + ' GB';
function human(b) {
  const u = ['B','KB','MB','GB','TB']; let i = 0;
  while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
  return (i ? b.toFixed(1) : b).toString().replace('.', ',') + ' ' + u[i];
}

async function api(url) { const r = await fetch(url); return r.json(); }

async function go(path) {
  path = (path || '').trim().replace(/^"|"$/g, '');
  if (!path) return;
  document.getElementById('status').textContent = 'Berechne Größen … (beim ersten Mal kann das bei großen Ordnern etwas dauern)';
  document.getElementById('content').innerHTML = '';
  if (path !== (current && current.path)) notice('');
  const data = await api('/api/list?path=' + encodeURIComponent(path));
  if (data.error) {
    document.getElementById('status').innerHTML = '<span class="error">' + esc(data.error) + '</span>';
    return;
  }
  current = data;
  document.getElementById('pathInput').value = data.path;
  history.replaceState(null, '', '?path=' + encodeURIComponent(data.path));
  render();
}

function render() {
  const d = current;
  document.getElementById('status').textContent = '';

  // Breadcrumbs: every part of the path is clickable
  const parts = d.path.split('\\').filter(Boolean);
  let acc = '';
  document.getElementById('crumbs').innerHTML = parts.map((p, i) => {
    acc += p + '\\';
    const target = acc;
    return `<a onclick='go(${JSON.stringify(target)})'>${esc(p)}</a>`;
  }).join(' › ');

  const emptyCount = d.folders.filter(f => f.empty).length;
  document.getElementById('summary').innerHTML = `
    <span>Gesamtgröße: <b>${gb(d.size)}</b> <span class="muted">(${human(d.size)})</span></span>
    <span>Unterordner: <b>${d.folders.length}</b></span>
    <span>Davon leer: <b>${emptyCount}</b></span>
    <span>Dateien (gesamt, inkl. Unterordner): <b>${d.total_files.toLocaleString('de-DE')}</b></span>
    <span>Leere Ordner (alle Ebenen): <b>${d.empty_dirs.toLocaleString('de-DE')}</b></span>
    <label><input type="checkbox" ${onlyEmpty ? 'checked' : ''} onchange="onlyEmpty=this.checked; render()"> nur leere Ordner zeigen</label>
    ${d.parent ? `<button onclick='go(${JSON.stringify(d.parent)})'>⬆ Eine Ebene hoch</button>` : ''}
    <button onclick='openExt(${JSON.stringify(d.path)})'>Im Explorer öffnen</button>
    <button onclick='showLargest()'>🔎 Größte Dateien hier (inkl. Unterordner)</button>
    <button class="danger" ${d.empty_dirs ? '' : 'disabled'} title="Löscht alle Ordner unterhalb dieses Pfads, in denen keine einzige Datei liegt (auch verschachtelte). Dateien werden nie gelöscht."
      onclick='deleteEmpty(${JSON.stringify(d.path)}, "below")'>🗑 Alle leeren Ordner hier löschen</button>`;

  const max = Math.max(1, ...d.folders.map(f => f.size), ...d.files.map(f => f.size));
  const folders = onlyEmpty ? d.folders.filter(f => f.empty) : d.folders;

  let html = '<h2>Unterordner</h2>';
  if (!folders.length) {
    html += '<p class="muted">Keine ' + (onlyEmpty ? 'leeren ' : '') + 'Unterordner.</p>';
  } else {
    html += `<table><tr><th>Name</th><th class="num">Größe (GB)</th><th></th><th>Unterordner?</th><th class="num">Dateien (gesamt)</th><th>Status</th><th></th><th></th></tr>`;
    for (const f of folders) {
      const status = f.denied ? '<span class="tag denied">kein Zugriff</span>'
                   : f.empty ? '<span class="tag empty">LEER</span>' : '';
      const sub = f.has_subdirs ? `<span class="tag yes">ja (${f.subdirs})</span>` : '<span class="tag no">nein</span>';
      html += `<tr class="folder ${f.empty ? 'empty' : ''}">
        <td class="name" onclick='go(${JSON.stringify(f.path)})'>📁 ${esc(f.name)}</td>
        <td class="num">${gb(f.size)}<br><span class="muted">${human(f.size)}</span></td>
        <td><div class="bar"><div style="width:${(f.size / max * 100).toFixed(1)}%"></div></div></td>
        <td>${sub}</td>
        <td class="num">${f.total_files.toLocaleString('de-DE')}</td>
        <td>${status}</td>
        <td><span class="link" onclick='openExt(${JSON.stringify(f.path)})'>Explorer</span></td>
        <td>${f.empty
              ? `<span class="link danger" title="Diesen Ordner samt seinen leeren Unterordnern löschen" onclick='deleteEmpty(${JSON.stringify(f.path)}, "self")'>🗑 Ordner löschen</span>`
              : f.empty_dirs
                ? `<span class="link danger" title="Nur die leeren Ordner darin löschen, dieser Ordner bleibt" onclick='deleteEmpty(${JSON.stringify(f.path)}, "below")'>🗑 ${f.empty_dirs} leere darin löschen</span>`
                : ''}</td>
      </tr>`;
    }
    html += '</table>';
  }

  if (!onlyEmpty) {
    html += `<h2>Dateien direkt in diesem Ordner (${d.files.length})</h2>`;
    if (!d.files.length) {
      html += '<p class="muted">Keine Dateien direkt in diesem Ordner.</p>';
    } else {
      html += `<table><tr><th>Name</th><th class="num">Größe (GB)</th><th></th><th></th></tr>`;
      for (const f of d.files.slice(0, 200)) {
        html += `<tr><td>📄 ${esc(f.name)}</td>
          <td class="num">${gb(f.size)}<br><span class="muted">${human(f.size)}</span></td>
          <td><div class="bar"><div style="width:${(f.size / max * 100).toFixed(1)}%"></div></div></td>
          <td><span class="link" onclick='openExt(${JSON.stringify(f.path)})'>Explorer</span></td></tr>`;
      }
      html += '</table>';
      if (d.files.length > 200) html += `<p class="muted">… und ${d.files.length - 200} weitere (kleinere) Dateien.</p>`;
    }
  }
  html += '<div id="largest"></div>';
  document.getElementById('content').innerHTML = html;
}

async function showLargest() {
  const box = document.getElementById('largest');
  box.innerHTML = '<h2>Größte Dateien (inkl. aller Unterordner)</h2><p class="muted">Suche …</p>';
  const data = await api('/api/largest?path=' + encodeURIComponent(current.path));
  const base = current.path.endsWith('\\') ? current.path : current.path + '\\';
  let html = '<h2>Größte Dateien (inkl. aller Unterordner)</h2><table><tr><th>Datei</th><th class="num">Größe (GB)</th><th></th></tr>';
  for (const f of data.files) {
    const rel = f.path.startsWith(base) ? f.path.slice(base.length) : f.path;
    html += `<tr><td>📄 ${esc(rel)}</td><td class="num">${gb(f.size)}<br><span class="muted">${human(f.size)}</span></td>
      <td><span class="link" onclick='openExt(${JSON.stringify(f.path)})'>Explorer</span></td></tr>`;
  }
  box.innerHTML = html + '</table>';
  box.scrollIntoView({ behavior: 'smooth' });
}

async function post(url) {
  const r = await fetch(url, { method: 'POST', headers: { 'X-FilesXray': '1' } });
  return r.json();
}

function notice(html, ok) {
  document.getElementById('notice').innerHTML = html ? `<div class="notice ${ok ? 'ok' : 'err'}">${html}</div>` : '';
}

// mode "self": the folder itself (only if it holds no files) incl. its empty subfolders
// mode "below": all empty folders anywhere inside; the folder itself stays
async function deleteEmpty(path, mode) {
  notice('');
  const q = '/api/delete-empty?mode=' + mode + '&path=' + encodeURIComponent(path);
  const preview = await post(q + '&dry=1');
  if (preview.error) { notice(esc(preview.error), false); return; }
  if (!preview.count) { notice('Keine leeren Ordner gefunden.', true); return; }

  const base = path.endsWith('\\') ? path : path + '\\';
  const rel = p => p.startsWith(base) ? p.slice(base.length) : p;
  const shown = preview.deleted.slice(0, 15).map(p => '  • ' + rel(p)).join('\n');
  const more = preview.count > 15 ? `\n  … und ${preview.count - 15} weitere` : '';
  const where = mode === 'self' ? `Ordner „${path}“ samt leeren Unterordnern` : `Leere Ordner unterhalb von\n${path}`;
  if (!confirm(`${where}\n\n${preview.count} leere(r) Ordner werden endgültig gelöscht (nicht im Papierkorb):\n\n${shown}${more}\n\nDateien werden nicht angetastet. Fortfahren?`)) return;

  const res = await post(q + '&dry=0');
  if (res.error) { notice(esc(res.error), false); return; }
  // After deleting the folder itself, stay in the current view; otherwise reload the same view.
  await go(current.path);
  let msg = `✔ ${res.count} leere(r) Ordner gelöscht.`;
  if (res.errors.length) {
    msg += `<br>${res.errors.length} Ordner konnten nicht gelöscht werden:<br>` +
      res.errors.slice(0, 10).map(e => esc(e.path) + ' <span class="muted">(' + esc(e.error) + ')</span>').join('<br>');
  }
  notice(msg, !res.errors.length);
}

function openExt(path) { fetch('/api/open?path=' + encodeURIComponent(path)); }

async function refresh() {
  await api('/api/refresh');
  if (current) go(current.path);
}

const startPath = new URLSearchParams(location.search).get('path') || DEFAULT_PATH;
document.getElementById('pathInput').value = startPath;
document.getElementById('pathInput').addEventListener('keydown', e => { if (e.key === 'Enter') go(e.target.value); });
go(startPath);
</script>
</body>
</html>
